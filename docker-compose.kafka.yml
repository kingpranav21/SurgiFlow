# Local Kafka (Redpanda) — practice the same produce/consume path without Confluent credits.
# Flink SQL itself still runs in Confluent Cloud for the submission.
#
#   docker compose -f docker-compose.kafka.yml up -d
#   # then set in .env:
#   PIPELINE_MODE=hybrid
#   KAFKA_BOOTSTRAP_SERVERS=localhost:19092
#   KAFKA_SECURITY_PROTOCOL=PLAINTEXT
#   python scripts/stream_processor.py
#   python scripts/stream_live.py --interval 3

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: surgiflow-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 10s
      timeout: 10s
      retries: 10
