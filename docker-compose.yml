services:
  postgres:
    image: postgres:16-alpine
    container_name: surgiflow-postgres
    environment:
      POSTGRES_USER: surgiflow
      POSTGRES_PASSWORD: surgiflow
      POSTGRES_DB: surgiflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surgiflow -d surgiflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: surgiflow-backend
    environment:
      DATABASE_URL: postgresql://surgiflow:surgiflow@postgres:5432/surgiflow
      RISK_ENGINE_MODE: local
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./scripts:/scripts

  frontend:
    build: ./frontend
    container_name: surgiflow-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
